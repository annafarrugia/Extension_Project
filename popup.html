<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />  
    <link rel="stylesheet" href="popup.css" />  
  </head>
  <body>

    <!-- Tab Buttons -->
    <div id="tab-buttons">
      <!-- When Individual Assignment is clicked, hides full syllabus and notifications tabs -->
      <button class="tab-btn" onclick=" document.getElementById('individual-tab').style.display = 'block'; 
        document.getElementById('syllabus-tab').style.display = 'none'; 
        document.getElementById('notifs-tab').style.display = 'none';

        this.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      ">Individual Assignment</button>
      <button class="tab-btn" onclick=" document.getElementById('syllabus-tab').style.display = 'block'; 
        document.getElementById('individual-tab').style.display = 'none'; 
        document.getElementById('notifs-tab').style.display = 'none';

        this.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      ">Full Syllabus</button>
      <button class="tab-btn" onclick=" document.getElementById('notifs-tab').style.display = 'block'; 
        document.getElementById('individual-tab').style.display = 'none'; 
        document.getElementById('syllabus-tab').style.display = 'none';
        
        this.parentElement.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
      ">Notifs</button> 
    </div>

    <!-- Tab 1: Individual Assignment -->
    <div class="tab-content" id="individual-tab">
        <!-- individual assignment content -->

        <select id="IA_document_dropdown" placeholder="Select Document" class= "document-selection">
          <!-- temporary until we figure out doc selection -->
          <option value="">-- Select Document --</option>
          <option value="doc1">Document 1</option>
          <option value="doc2">Document 2</option>
        </select>
        <!-- selecting course-->
         <select id="IA_course_dropdown" placeholder="Select Course" class="course-details">
          <option value="">-- Select Course --</option>
          <option value="course1">Course 1</option>
          <option value="course2">Course 2</option>
         </select>
        <!-- selecting due date and time -->
        <input id="IA_due_date" type="date" placeholder="Due Date" class="course-details"/>
        <input id="IA_time_due" type="time" placeholder="Time Due" class="course-details"/>
        <!-- assignment name and description -->
        <input id="IA_assignment_name" placeholder="Assignment Name" />
        <input id="IA_assignment_description" placeholder="Assignment Description" />
        <!-- submit button -->
        <button id="IA_submit_btn">Add Assignment</button>
    </div>

    <!-- Tab 2: Full Syllabus -->
    <div class="tab-content" id="syllabus-tab">
      <!-- Selection of Document Name-->
      <select id="FS_document_dropdown" placeholder="Select Document">
          <!-- temporary until we figure out doc selection -->
          <option value="">-- Select Document --</option>
          <option value="doc1">Document 1</option>
          <option value="doc2">Document 2</option>
        </select>
      
      <!-- Copy and Pasted Syllabus content-->
      <input id="FS_full_syllabus" placeholder="Syllabus Content" />
      
      <!-- Submit button -->
      <div class="submit-container">
      <button id="IA_submit_btn">Add Assignment</button>
    </div>

    <!-- Tab 3: Notifs -->
    <div class="tab-content" id="notifs-tab">
      <!-- Email Notifs-->
      <p>Email Notifications</p>
      <input id="notif_toggle" type="checkbox" />

      <!-- Popup Notifs-->
      <p>Computer Popup Notifs</p>
      <input id="popup_toggle" type="checkbox" />

      <!-- 30 min Before Due-Date Popup Notifs-->
      <p>30 min Before Due-Date Popup</p>
      <input id="30min_toggle" type="checkbox" />

      <!-- Exam Notifs-->
      <p>Exam Notifications</p>
      <input id="exam_toggle" type="checkbox" />

    </div>

    <script src="popup.js"></script>
  </body>
</html>
